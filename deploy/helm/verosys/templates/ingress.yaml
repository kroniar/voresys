{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: verosys }
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: verosys-frontend, port: { number: 80 } } }
          - path: /api
            pathType: Prefix
            backend: { service: { name: verosys-backend, port: { number: 8000 } } }
{{- end }}
