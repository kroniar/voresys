name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: verosys, POSTGRES_USER: verosys, POSTGRES_PASSWORD: verosys }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U verosys -d verosys" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: python manage.py test
        env: { POSTGRES_HOST: localhost, POSTGRES_PASSWORD: verosys }
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/verosys
